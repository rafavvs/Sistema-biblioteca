<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Autores | Biblioteca</title></head>
<body>
<h1>Autores</h1>
<nav><a th:href="@{/livros}">Livros</a> <a th:href="@{/categorias}">Categorias</a> <a th:href="@{/usuarios}">Usuários</a> <a th:href="@{/emprestimos}">Empréstimos</a></nav>
<p th:if="${mensagem}" th:text="${mensagem}"></p><p th:if="${erro}" th:text="${erro}"></p>
<p><a th:href="@{/autores/novo}">Cadastrar autor</a></p>
<p th:if="${#lists.isEmpty(autores)}">Nenhum autor cadastrado.</p>
<table th:unless="${#lists.isEmpty(autores)}">
    <thead><tr><th>Nome</th><th>Nacionalidade</th><th>Obras</th><th>Ações</th></tr></thead>
    <tbody><tr th:each="autor : ${autores}">
        <td th:text="${autor.nome}"></td><td th:text="${autor.nacionalidade}"></td>
        <td th:text="${autor.obrasPublicadas.size()}"></td>
        <td><a th:href="@{/autores/{id}/editar(id=${autor.id})}">Editar</a>
            <form th:action="@{/autores/{id}/excluir(id=${autor.id})}" method="post"><button type="submit">Excluir</button></form></td>
    </tr></tbody>
</table>
</body>
</html>
